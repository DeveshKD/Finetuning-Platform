[project]
name = "gemma-finetune-platform"
version = "0.1.0"
description = "Strict fine-tuning-only platform: LoRA/QLoRA training on a single GPU, with a resource-aware job orchestrator, live metrics, and automatic evaluation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.42",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "accelerate>=0.31",
    "datasets>=2.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "openai>=3.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
